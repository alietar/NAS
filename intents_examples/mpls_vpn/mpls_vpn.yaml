gns:
  enable: true
  host: 127.0.0.1
  port: 3080
  project_name: Test 2
  create_routers: true
  create_links: true
  arrange: true
  auto_fetch_router_infos: true

project:
  write: false
  ip_version: ipv4
  auto_create_address:
    physical: false 
    Loopback: true

as:
  - asn: 1
    internal_protocol: OSPF
    bgp_deployement: border
    redistribute_internal: true

  - asn: 2
    internal_protocol: OSPF
    bgp_deployement: border
    redistribute_internal: true

  - asn: 3
    internal_protocol: OSPF
    bgp_deployement: every
    redistribute_internal: false

  - asn: 4
    internal_protocol: OSPF
    bgp_deployement: border
    redistribute_internal: true

  - asn: 5
    internal_protocol: OSPF
    bgp_deployement: border
    redistribute_internal: true

routers:
  - name: C1_Client_1
    asn: 1
    id: 1
  - name: CE1_Client_1
    asn: 1
    id: 2

  - name: C1_Client_2
    asn: 2
    id: 3
  - name: CE1_Client_2
    asn: 2
    id: 4

  - name: PE1
    asn: 3
    id: 5
  - name: P1
    asn: 3
    id: 6
  - name: P2
    asn: 3
    id: 7
  - name: PE2
    asn: 3
    id: 8

  - name: C2_Client_1
    asn: 4
    id: 9
  - name: CE2_Client_1
    asn: 4
    id: 10

  - name: C2_Client_2
    asn: 5
    id: 11
  - name: CE2_Client_2
    asn: 5
    id: 12

links:
