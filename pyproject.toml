[project]
name = "nas"
version = "0.0.1"
description = "Infrastructure as Code tool to configure Cisco routers, with an emphasis on GNS simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["telnetlib3", "rich", "click", "pydantic==1.9.2", "gns3fy==0.8.0"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"


[project.scripts]
nas = "nas.main:main"

[tool.setuptools]
package-dir = { "" = "src" }